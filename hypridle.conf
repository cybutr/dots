#  ◈ HYPRIDLE CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    lock_cmd = bash ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 500
    on-timeout = bash -c 'brightnessctl -s set 20%; touch /tmp/qs_pc_idle'
    on-resume = bash -c 'brightnessctl -r; rm -f /tmp/qs_pc_idle'
}

listener {
    timeout = 550
    on-timeout = bash ~/.config/hypr/scripts/idle_enter.sh
    on-resume = bash ~/.config/hypr/scripts/idle_resume.sh
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
