#  ◈ MONITORS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

monitor = , preferred, auto, 1.0


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ ENVIRONMENT VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

env = NIXOS_OZONE_WL,1

source = ~/.config/hypr/exec.conf

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ CORE VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$mainMod = SUPER
$terminal = kitty

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

source = ~/.config/hypr/colors.conf

general {
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    gaps_in = 4
    gaps_out = 4
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        special = true
    }
    dim_special = 0.45
    shadow {
        enabled = false
    }
}


input {
    kb_layout = us,cz
    kb_options =

    touchpad {
        natural_scroll = false
	disable_while_typing = false
    }

}

cursor {
    no_warps = true
}

misc {
    font_family = JetBrainsMono Nerd Font
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# Animations + dim: generated by scripts/hypr_polish_apply.sh from settings.json (Guide > HYPRLAND POLISH)
source = ~/.config/hypr/polish.conf
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr6"
    match:namespace = qs-ambient-glow
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

# ─────────────────────────────
# Window rules
# ─────────────────────────────

# ───────── App Launcher ─────────
windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

# ───────── MASTER QUICKSHELL CONTAINER ─────────
windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}

windowrule {
    name = "scratchpad"
    match:title = ^(qs-scratchpad)$
    float = on
    pin = on
    no_initial_focus = on
}

# ───────── Mira (Gmail client) ─────────
windowrule {
    name = "mira_scratchpad"
    match:class = ^(mira)$
    workspace = special:mira silent
    float = on
    size = 1200 800
    center = on
    rounding = 14
    animation = popin 92%
    no_dim = on
}

# ───────── Startup Workspace Assignment ─────────
# Class-match based, not PID-tracked — this is what actually holds up under
# a real concurrent cold boot. Tested: with all 4 apps launching at once,
# the old poll-and-move approach (open_on_workspace.sh, 15s timeout) still
# missed vivaldi/firefox — their windows took >15s to map under real CPU
# contention. windowrule had zero misses across two full concurrent-boot
# tests. Trade-off: any new window of these classes always homes here
# (e.g. a fresh Firefox window always opens on ws2) — intentional, matches
# this rice's one-home-workspace-per-app design.
windowrule {
    name = "vivaldi_workspace"
    match:class = ^(vivaldi-stable)$
    workspace = 1 silent
}

windowrule {
    name = "firefox_workspace"
    match:class = ^(firefox)$
    workspace = 2 silent
}

windowrule {
    name = "spotify_workspace"
    match:class = ^(spotify)$
    workspace = 4 silent
}

windowrule {
    name = "vesktop_workspace"
    match:class = ^(vesktop)$
    workspace = 3 silent
}

layerrule {
    name = "master_blur"
    match:namespace = qs-master
    blur = on
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace
gesture = 4, left, workspace, -1
gesture = 4, right, workspace, +1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ───────── Window Management ─────────
bind = $mainMod, Q, exec, bash -c 'if hyprctl activewindow | grep -q "title: qs-master"; then ~/.config/hypr/scripts/qs_manager.sh close; else hyprctl dispatch killactive; fi'
bind = $mainMod, D, fullscreen, 1
bind = $mainMod&SHIFT_L, D, fullscreen, 0
bind = $mainMod&SHIFT_L, F, exec, bash -c 'if ! hyprctl activewindow | grep -q "title: qs-master"; then hyprctl dispatch togglefloating; fi'
binde = $mainMod&SHIFT_L, left, resizeactive,-50 0
binde = $mainMod&SHIFT_L, right, resizeactive,50 0
binde = $mainMod&SHIFT_L, up, resizeactive,0 -50
binde = $mainMod&SHIFT_L, down, resizeactive,0 50
bind = $mainMod&CTRL, left, movewindow, l
bind = $mainMod&CTRL, right, movewindow, r
bind = $mainMod&CTRL, up, movewindow, u
bind = $mainMod&CTRL, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ───────── Applications & Launchers ─────────
bind = $mainMod, T, exec, $terminal
bind = $mainMod, F, exec, vivaldi
bind = $mainMod, C, exec, flatpak run com.visualstudio.code
bind = $mainMod&SHIFT_L, C, exec, hyprpicker -a
bind = $mainMod, E, exec, nautilus
bind = $mainMod, A, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, grave, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle claudeask
bind = $mainMod, G, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle quicktell
bind = $mainMod ALT, G, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle quicktell voice
bind = ALT, TAB, exec, ~/.config/hypr/scripts/alttab.sh
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle clipboard
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/qs_manager.sh toggle workspaces
bind = $mainMod&SHIFT_L, A, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle notifications
bind = $mainMod&SHIFT_L, E, exec, ~/.config/hypr/scripts/qs_manager.sh toggle power

# ───────── Quickshell Controls ─────────
bind = $mainMod&SHIFT_L, X, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = $mainMod&SHIFT_L, S, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/screenshot.sh --freeze
bind = $mainMod&SHIFT_L, Z, exec, bash ~/.config/hypr/scripts/quickshell/claude/screenshot_ask.sh
bind = $mainMod CTRL, Z, exec, bash ~/.config/hypr/scripts/quickshell/claude/screenshot_answer.sh
bind = $mainMod ALT, Z, exec, bash ~/.config/hypr/scripts/quickshell/claude/shot_ask.sh
bind = $mainMod ALT, R, exec, ~/.config/hypr/scripts/screenrec-toggle.sh full
bind = $mainMod ALT&SHIFT_L, R, exec, ~/.config/hypr/scripts/screenrec-toggle.sh region
bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = $mainMod, B, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle battery
bind = $mainMod, P, exec, bash ~/.config/hypr/scripts/scratchpad.sh
bind = $mainMod&SHIFT_L, G, exec, bash ~/.config/hypr/scripts/toggle_night_light.sh
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspacesilent, special:magic
bind = $mainMod SHIFT, Y, exec, bash ~/.config/hypr/scripts/mira_toggle.sh
bind = $mainMod, N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = $mainMod, U, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle quicksettings
bind = $mainMod&SHIFT_L, T, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle focustime
bind = $mainMod&SHIFT_L, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle volume
bind = $mainMod&SHIFT_L, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle guide
bind = $mainMod&SHIFT_L, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = $mainMod&SHIFT_L, I, exec, bash ~/.config/hypr/scripts/toggle_hypridle.sh
bind = $mainMod ALT, K, exec, bash ~/.config/hypr/scripts/toggle_wakelock.sh
bind = $mainMod ALT, B, exec, bash ~/.config/hypr/scripts/toggle_brightness_curve.sh
bind = $mainMod ALT, W, exec, bash ~/.config/hypr/scripts/quickshell/claude/voice/kandor_toggle.sh

# hold ~1.6s to force-kill quickshell (all processes) — for when it's frozen/unresponsive
# pure-bash hold timer, does not depend on quickshell being alive
bind = $mainMod ALT&SHIFT_L, K, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh start emergency_kill_quickshell
bindr = $mainMod ALT&SHIFT_L, K, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh abort emergency_kill_quickshell

# hold ~1.0s to toggle do-not-disturb (swaync)
bind = $mainMod ALT&SHIFT_L, D, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh start toggle_dnd
bindr = $mainMod ALT&SHIFT_L, D, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh abort toggle_dnd

# hold ~1.8s to lock screen then suspend
bind = $mainMod ALT&SHIFT_L, L, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh start lock_and_suspend
bindr = $mainMod ALT&SHIFT_L, L, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh abort lock_and_suspend

# hold ~1.2s to instantly mute all audio output
bind = $mainMod ALT&SHIFT_L, M, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh start emergency_mute
bindr = $mainMod ALT&SHIFT_L, M, exec, bash ~/.config/hypr/scripts/quickshell/holdactions/holdaction_run.sh abort emergency_mute

# ───────── System & Hardware ─────────
# bindl = ALT_L, SHIFT_L, exec, hyprctl switchxkblayout main prev
# bindl = SHIFT_L, ALT_L, exec, hyprctl switchxkblayout main next
bind = $mainMod SHIFT, SPACE, exec, bash ~/.config/hypr/scripts/switch_kb_layout.sh
bind = $mainMod ALT, A, exec, bash ~/.config/hypr/scripts/anthropic_acct.sh cycle
bindl = , Caps_Lock, exec, sleep 0.1 && bash ~/.config/hypr/scripts/capslock_osd.sh
bindl = , XF86MonBrightnessDown, exec, bash ~/.config/hypr/scripts/brightness_step.sh lower
bindl = , XF86MonBrightnessUp, exec, bash ~/.config/hypr/scripts/brightness_step.sh raise
bindl = SUPER, XF86MonBrightnessDown, exec, bash ~/.config/hypr/scripts/media_seek.sh back
bindl = SUPER, XF86MonBrightnessUp, exec, bash ~/.config/hypr/scripts/media_seek.sh forward
bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = SUPER SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh
bindel = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh

# ───────── Media & Audio ─────────
bindl = $mainMod CTRL, M, exec, bash ~/.config/hypr/scripts/volume_step.sh mute-toggle
bindl = $mainMod ALT, M, exec, bash ~/.config/hypr/scripts/mic_mute_toggle.sh
bindl = $mainMod, SPACE, exec, bash ~/.config/hypr/scripts/media_control.sh play-pause
bindl = $mainMod, period, exec, bash ~/.config/hypr/scripts/media_control.sh next
bindl = $mainMod, comma, exec, bash ~/.config/hypr/scripts/media_control.sh previous
bindl = , XF86AudioPause, exec, playerctl --player=spotify play-pause
bindl = , XF86AudioPlay, exec, playerctl --player=spotify play-pause
bindl = , xf86AudioMicMute, exec, bash ~/.config/hypr/scripts/mic_mute_toggle.sh
bindl = , xf86audiomute, exec, bash ~/.config/hypr/scripts/volume_step.sh mute-toggle
bindel = , xf86audiolowervolume, exec, bash ~/.config/hypr/scripts/volume_step.sh lower
bindel = , xf86audioraisevolume, exec, bash ~/.config/hypr/scripts/volume_step.sh raise
bindel = $mainMod, XF86AudioLowerVolume, exec, bash ~/.config/hypr/scripts/spotify_volume.sh lower
bindel = $mainMod, XF86AudioRaiseVolume, exec, bash ~/.config/hypr/scripts/spotify_volume.sh raise
# overcharge — push past 100% (up to 150%), same combo lowers back down
bindel = $mainMod SHIFT, XF86AudioRaiseVolume, exec, bash ~/.config/hypr/scripts/volume_step.sh raise 150
bindel = $mainMod SHIFT, XF86AudioLowerVolume, exec, bash ~/.config/hypr/scripts/volume_step.sh lower 150

# ───────── Workspaces ─────────
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10

bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1 move
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2 move
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3 move
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4 move
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5 move
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6 move
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7 move
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8 move
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9 move
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10 move

# ───────── ALT+TAB Submap ─────────
submap = alttab
bind = ALT, TAB, exec, bash -c "echo next > /tmp/qs_alttab_nav"
bind = , Return, exec, bash -c "echo confirm > /tmp/qs_alttab_nav"
bind = , Return, submap, reset
bind = , escape, exec, bash -c "echo close > /tmp/qs_widget_state"
bind = , escape, submap, reset
submap = reset

# ───────── Leader Key Submap ─────────
# SUPER+J enters "leader" mode, then a bare second key (within ~600ms,
# auto-resets via leader_timeout.sh) fires a distinct action. Add more
# sequences by adding another `bind = , KEY, exec, ...` + `bind = , KEY,
# submap, reset` pair inside the submap below.
bind = $mainMod, J, submap, leader
bind = $mainMod, J, exec, bash ~/.config/hypr/scripts/leader_timeout.sh

submap = leader
bind = , C, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = , C, submap, reset
bind = , M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = , M, submap, reset
bind = , N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = , N, submap, reset
bind = , escape, submap, reset
submap = reset

