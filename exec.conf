# ───────── Network ─────────
exec-once = ~/.local/bin/eduroam-connect.sh

# ───────── System Services ─────────
exec-once = libinput-gestures
exec-once = awww-daemon
exec-once = hypridle
exec-once = playerctld
exec-once = systemctl --user enable --now easyeffects
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ydotoold
exec-once = node ~/.local/share/discord-mcp/bridge.mjs
exec-once = gsettings set org.gnome.desktop.interface toolkit-accessibility true
exec-once = python3 ~/.config/hypr/scripts/electron-a11y.py

# ───────── Hypr Scripts ─────────
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = ~/.config/hypr/scripts/ws_thumb_daemon.sh
exec-once = ~/.config/hypr/scripts/ws_thumb_interval.sh
exec-once = ~/.config/hypr/scripts/settings_watcher.sh
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = ~/.config/hypr/scripts/night_light.sh
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/NightLightOsd.qml
exec-once = ~/.config/hypr/scripts/brightness_curve.sh
exec-once = ~/.config/hypr/scripts/brightness_curve_interval.sh
exec-once = ~/.config/hypr/scripts/brightness_watch.sh
exec-once = setsid -f python3 ~/.config/hypr/scripts/eco_daemon.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/leak_reaper.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/perf_watch.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/smartws.py daemon
exec-once = setsid -f python3 ~/.config/hypr/scripts/ws_accent.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/quickshell/music/spotify_history_daemon.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/quickshell/claude/gmail_code_watcher.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/quickshell/claude/qs_remote.py
exec-once = setsid -f python3 ~/.config/hypr/scripts/quickshell/claude/fleet_watch.py

# ───────── Quickshell UI ─────────
exec-once = pkill -x swaync
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/TopBar.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/BatteryAlarm.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/PresenterFx.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/AmbientGlow.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/IdleAmbient.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/KbOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/AcctOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/IdleOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/WakeLockOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/BrightnessCurveOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/VolumeOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/CapsOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/MicOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/BrightnessOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/SpotifyVolumeOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/MediaOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/ResidentOsd.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/StageDock.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/ScratchpadHost.qml
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py
exec-once = bash ~/.config/hypr/scripts/quickshell/calendar/schedule/calendar_daemon.sh
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/context_daemon.sh
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/claude_daemon.sh
exec-once = bash ~/.config/hypr/scripts/quickshell/music/music_watch.sh
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/claude_resident.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/focus_insight.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/clip_watch.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/resume_watch.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/project_watch.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/notif_digest.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/net_watch.py
exec-once = python3 ~/.config/hypr/scripts/quickshell/claude/device_watch.py
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/discord_profiler.sh autostart
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/voice/stt.sh
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/voice/wake.sh
exec-once = bash ~/.config/hypr/scripts/quickshell/claude/vpn_autoconnect.sh
exec-once = ~/.config/hypr/scripts/qs_manager.sh toggle guide

# ───────── Startup Workspace & Apps ─────────
# Configured via the "Startup" tab in the guide popup (SUPER+SHIFT+H) —
# edits ~/.config/hypr/scripts/quickshell/startup_apps.json
exec-once = ~/.config/hypr/scripts/quickshell/startup_apps.sh
